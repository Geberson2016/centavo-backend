# Perfil dos testes que sobem banco (@ActiveProfiles("test")).
# E autossuficiente: o application.properties fica fora do git, entao numa maquina limpa
# (ou no CI) os testes nao podem depender dele. O datasource vem do Testcontainers.

# Segredo so de teste; nao e usado em nenhum outro lugar.
api.security.token.secret=test-only-secret-do-not-use-elsewhere

# O schema vem das migracoes do Flyway, e o Hibernate so confere se as entidades batem com ele.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
