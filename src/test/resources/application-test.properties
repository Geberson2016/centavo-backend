# Perfil dos testes que sobem banco (@ActiveProfiles("test")). O datasource vem do
# Testcontainers; aqui fica o que o application.properties le do ambiente (o JWT_SECRET
# nao tem default) e o que os testes precisam diferente dele.

# Segredo so de teste; nao e usado em nenhum outro lugar.
api.security.token.secret=test-only-secret-do-not-use-elsewhere

# O schema vem das migracoes do Flyway, e o Hibernate so confere se as entidades batem com ele.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
