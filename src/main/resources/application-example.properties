spring.application.name=centavo

# Conexao com o banco. Em producao, defina as variaveis de ambiente abaixo.
# Localmente, os defaults apos ':' permitem subir sem configurar nada.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/centavo}
spring.datasource.username=${DB_USERNAME:admin}
spring.datasource.password=${DB_PASSWORD:admin}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Segredo de assinatura do JWT. OBRIGATORIO: defina JWT_SECRET no ambiente.
# Nunca commite o valor real. Use um segredo forte e aleatorio em producao.
api.security.token.secret=${JWT_SECRET}

# Como rodar localmente:
#   1. Copie este arquivo para application.properties (que fica no .gitignore)
#   2. Exporte as variaveis, no minimo JWT_SECRET, por exemplo:
#        export JWT_SECRET="troque-por-um-segredo-forte"
#   3. ./mvnw spring-boot:run
