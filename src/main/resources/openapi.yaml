openapi: 3.0.3
info:
  title: Centavo API
  version: 1.0.0
  description: |
    API de domínio do Centavo (finanças pessoais).

    Este arquivo é a **fonte única da verdade** do contrato (AGENTS.md §1.3): as interfaces
    Java do servidor são geradas a partir dele no build, e o client TypeScript do frontend
    também. Paths, `operationId` e nomes de schema ficam em inglês; descrições em português.

    **Autenticação:** JWT no header `Authorization: Bearer <token>`, obtido em
    `POST /api/v1/users/login`. Só `register` e `login` são públicos.

    **Escopo por usuário:** toda leitura e escrita é restrita ao usuário autenticado. Um
    recurso de outro usuário é tratado como inexistente (`*_NOT_FOUND`).

    **Erros:** respostas de erro seguem a RFC 7807 (`application/problem+json`) com um
    `code` estável, que o frontend traduz para a mensagem localizada.
servers:
  - url: http://localhost:8080
    description: Execução local
security:
  - bearerAuth: []
tags:
  - name: Users
    description: Cadastro e autenticação
  - name: Accounts
    description: Contas do usuário (corrente, poupança, cartão…)
  - name: Categories
    description: Categorias de receita e despesa
  - name: Transactions
    description: Lançamentos de receita e despesa
  - name: Dashboard
    description: Indicadores consolidados

paths:
  /api/v1/users/register:
    post:
      tags: [Users]
      operationId: register
      summary: Cadastra um novo usuário
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRequest'
      responses:
        '201':
          description: Usuário criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRegisterResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          description: E-mail já cadastrado (`EMAIL_ALREADY_EXISTS`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /api/v1/users/login:
    post:
      tags: [Users]
      operationId: login
      summary: Autentica o usuário e devolve o JWT
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRequest'
      responses:
        '200':
          description: Autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: E-mail ou senha inválidos (`INVALID_CREDENTIALS`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /api/v1/accounts:
    get:
      tags: [Accounts]
      operationId: listAccounts
      summary: Lista as contas do usuário
      responses:
        '200':
          description: Contas do usuário
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AccountResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Accounts]
      operationId: createAccount
      summary: Cria uma conta
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountRequest'
      responses:
        '201':
          description: Conta criada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/accounts/{id}:
    get:
      tags: [Accounts]
      operationId: getAccount
      summary: Busca uma conta pelo id
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Conta encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Conta inexistente ou de outro usuário (`ACCOUNT_NOT_FOUND`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /api/v1/accounts/accountSummary:
    get:
      tags: [Accounts]
      operationId: getAccountSummary
      summary: Lista as contas com o total de receitas e despesas de cada uma
      description: Totais acumulados de todos os lançamentos da conta, sem filtro de período.
      responses:
        '200':
          description: Resumo por conta
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AccountSummaryResponse'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/categories:
    get:
      tags: [Categories]
      operationId: listCategories
      summary: Lista as categorias do usuário
      responses:
        '200':
          description: Categorias do usuário
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CategoryResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Categories]
      operationId: createCategory
      summary: Cria uma categoria
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryRequest'
      responses:
        '201':
          description: Categoria criada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/categories/{id}:
    get:
      tags: [Categories]
      operationId: getCategory
      summary: Busca uma categoria pelo id
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Categoria encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Categoria inexistente ou de outro usuário (`CATEGORY_NOT_FOUND`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /api/v1/transactions:
    get:
      tags: [Transactions]
      operationId: listTransactions
      summary: Lista os lançamentos do usuário
      responses:
        '200':
          description: Lançamentos do usuário
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TransactionResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Transactions]
      operationId: createTransaction
      summary: Cria um lançamento
      description: O `type` do lançamento precisa ser igual ao `type` da categoria.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionRequest'
      responses:
        '201':
          description: Lançamento criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Conta ou categoria inexistente ou de outro usuário (`ACCOUNT_NOT_FOUND`, `CATEGORY_NOT_FOUND`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Tipo do lançamento difere do tipo da categoria (`TRANSACTION_CATEGORY_TYPE_MISMATCH`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /api/v1/transactions/{id}:
    get:
      tags: [Transactions]
      operationId: getTransaction
      summary: Busca um lançamento pelo id
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Lançamento encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Lançamento inexistente ou de outro usuário (`TRANSACTION_NOT_FOUND`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /api/v1/transactions/recent:
    get:
      tags: [Transactions]
      operationId: listRecentTransactions
      summary: Lista os lançamentos dos últimos 30 dias
      responses:
        '200':
          description: Lançamentos recentes, do mais novo para o mais antigo
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RecentTransactionResponse'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/dashboard/summary:
    get:
      tags: [Dashboard]
      operationId: getDashboardSummary
      summary: Indicadores do mês corrente e saldo geral
      responses:
        '200':
          description: Indicadores do dashboard
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardSummaryResponse'
        '403':
          $ref: '#/components/responses/Forbidden'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64

  responses:
    ValidationError:
      description: Corpo inválido ou ilegível (`VALIDATION_ERROR`)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Token ausente, inválido ou expirado (sem corpo)

  schemas:
    # --- Enums de domínio ---
    TransactionType:
      type: string
      enum: [INCOME, EXPENSE]
    AccountType:
      type: string
      enum: [CHECKING, SAVINGS, INVESTMENT, CASH, CREDIT_CARD]
    BudgetType:
      type: string
      enum: [FIXED, VARIABLE]

    # --- Usuários ---
    UserRequest:
      type: object
      required: [name, email, password]
      properties:
        name:
          type: string
          minLength: 1
        email:
          type: string
          format: email
        phone:
          type: string
          nullable: true
        password:
          type: string
          minLength: 6
    UserRegisterResponse:
      type: object
      required: [name]
      properties:
        name:
          type: string
    AuthRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1
    UserResponse:
      type: object
      required: [id, name, email, token]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        email:
          type: string
        token:
          type: string
          description: 'JWT a enviar como `Authorization: Bearer <token>`'

    # --- Contas ---
    AccountRequest:
      type: object
      required: [name, type]
      properties:
        name:
          type: string
          minLength: 1
        type:
          $ref: '#/components/schemas/AccountType'
        userId:
          type: integer
          format: int64
          nullable: true
          deprecated: true
          description: Ignorado — o dono da conta é sempre o usuário autenticado.
    AccountResponse:
      type: object
      required: [id, name, type, userId]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        type:
          $ref: '#/components/schemas/AccountType'
        userId:
          type: integer
          format: int64
    AccountSummaryResponse:
      type: object
      required: [accountId, accountName, accountType, totalRevenue, totalExpense]
      properties:
        accountId:
          type: integer
          format: int64
        accountName:
          type: string
        accountType:
          $ref: '#/components/schemas/AccountType'
        totalRevenue:
          type: number
          description: Soma dos lançamentos INCOME da conta
        totalExpense:
          type: number
          description: Soma dos lançamentos EXPENSE da conta

    # --- Categorias ---
    CategoryRequest:
      type: object
      required: [name, type, budgetType]
      properties:
        name:
          type: string
          minLength: 1
        type:
          $ref: '#/components/schemas/TransactionType'
        userId:
          type: integer
          format: int64
          nullable: true
          deprecated: true
          description: Ignorado — o dono da categoria é sempre o usuário autenticado.
        budgetType:
          $ref: '#/components/schemas/BudgetType'
    CategoryResponse:
      type: object
      required: [id, name, type, userId, budgetType]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        type:
          $ref: '#/components/schemas/TransactionType'
        userId:
          type: integer
          format: int64
        budgetType:
          $ref: '#/components/schemas/BudgetType'

    # --- Lançamentos ---
    TransactionRequest:
      type: object
      required: [description, value, date, accountId, categoryId, type]
      properties:
        description:
          type: string
          minLength: 1
        value:
          type: number
          exclusiveMinimum: true
          minimum: 0
          description: Valor positivo; o sinal vem do `type`
        date:
          type: string
          format: date
          description: Data do lançamento; datas após o fim do mês corrente contam como agendadas
        accountId:
          type: integer
          format: int64
        categoryId:
          type: integer
          format: int64
        type:
          $ref: '#/components/schemas/TransactionType'
    TransactionResponse:
      type: object
      required: [id, description, value, date, type, accountId, categoryId]
      properties:
        id:
          type: integer
          format: int64
        description:
          type: string
        value:
          type: number
        date:
          type: string
          format: date
        type:
          $ref: '#/components/schemas/TransactionType'
        accountId:
          type: integer
          format: int64
        categoryId:
          type: integer
          format: int64
    RecentTransactionResponse:
      type: object
      required: [description, categoryName, date, value, type]
      properties:
        description:
          type: string
        categoryName:
          type: string
        date:
          type: string
          format: date
        value:
          type: number
        type:
          $ref: '#/components/schemas/TransactionType'

    # --- Dashboard ---
    DashboardSummaryResponse:
      type: object
      required:
        - totalBalance
        - creditCardBill
        - monthlySavings
        - totalExpense
        - totalRevenue
        - scheduledRevenue
        - scheduledExpense
      properties:
        totalBalance:
          type: number
          description: Receitas menos despesas de todos os lançamentos, sem filtro de período
        creditCardBill:
          type: number
          description: Despesas do mês corrente em contas CREDIT_CARD
        monthlySavings:
          type: number
          description: Receitas menos despesas do mês corrente
        totalExpense:
          type: number
          description: Despesas do mês corrente
        totalRevenue:
          type: number
          description: Receitas do mês corrente
        scheduledRevenue:
          type: number
          description: Receitas com data após o fim do mês corrente
        scheduledExpense:
          type: number
          description: Despesas com data após o fim do mês corrente

    # --- Erros (RFC 7807) ---
    Problem:
      type: object
      description: Erro no formato RFC 7807 (`application/problem+json`)
      required: [status, code]
      properties:
        type:
          type: string
          example: about:blank
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
          description: Detalhe técnico opcional, para debug — não exibir ao usuário
        instance:
          type: string
        code:
          $ref: '#/components/schemas/ErrorCode'
        errors:
          type: array
          description: Presente só em `VALIDATION_ERROR`
          items:
            $ref: '#/components/schemas/FieldError'
    FieldError:
      type: object
      required: [field]
      properties:
        field:
          type: string
          description: Caminho do campo inválido no corpo
        message:
          type: string
          description: Mensagem do bean validation (apenas para debug)
        accepted:
          type: array
          description: Valores aceitos, quando o campo é um enum com valor fora do domínio
          items:
            type: string
    ErrorCode:
      type: string
      enum:
        - ACCOUNT_NOT_FOUND
        - CATEGORY_NOT_FOUND
        - TRANSACTION_NOT_FOUND
        - EMAIL_ALREADY_EXISTS
        - TRANSACTION_CATEGORY_TYPE_MISMATCH
        - INVALID_CREDENTIALS
        - VALIDATION_ERROR
        - INTERNAL_ERROR
