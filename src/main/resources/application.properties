spring.application.name=centavo

# Este arquivo e versionado e nao guarda segredo: tudo vem de variaveis de ambiente.
# No docker compose (repositorio centavo-infra) os valores saem do .env, que fica fora do git.
# Os defaults apos ':' so servem para rodar local sem configurar o banco.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/centavo}
spring.datasource.username=${DB_USERNAME:admin}
spring.datasource.password=${DB_PASSWORD:admin}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway cuida do schema. baseline-on-migrate adota o banco ja existente sem recriar nada.
spring.flyway.baseline-on-migrate=true

# Segredo de assinatura do JWT. OBRIGATORIO e sem default: sem JWT_SECRET a API nao sobe.
# Use um valor forte e aleatorio (ex.: openssl rand -hex 32).
api.security.token.secret=${JWT_SECRET}

# Origens liberadas no CORS (lista separada por virgula). O browser fala com o BFF, nao com
# a API; isto so importa para quem chamar a API direto de outra origem.
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Rodar fora do compose: export JWT_SECRET=... && ./mvnw spring-boot:run
