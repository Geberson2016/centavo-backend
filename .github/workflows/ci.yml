# Pipeline do backend: compila (gerando as interfaces a partir do openapi.yaml) e roda
# todos os testes, inclusive os de repository e de integração, que sobem Postgres pelo
# Testcontainers (o runner do GitHub já tem Docker). Não depende do application.properties,
# que fica fora do git: os testes usam o perfil "test".
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Build e testes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: mvn verify
        run: ./mvnw -B verify

      - name: Relatórios dos testes (só em falha)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 7
